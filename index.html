<!-- 1. Seleccionar Producto -->
<h3>1. Seleccionar Producto</h3>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
    <div>
        <label>Marca / Producto</label>
        <select id="selectMarca" onchange="actualizarOpcionesColores()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <option value="">Selecciona una marca...</option>
        </select>
    </div>

    <div>
        <label>Color</label>
        <select id="selectColor" onchange="actualizarOpcionesTallas()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" disabled>
            <option value="">Primero elige Marca</option>
        </select>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
    <div>
        <label>Talla</label>
        <select id="selectTalla" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" disabled>
            <option value="">Primero elige Color</option>
        </select>
    </div>

    <div>
        <label>Cantidad a Vender</label>
        <input type="number" id="cantVender" value="1" min="1" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
    </div>
</div>

<button id="btnAgregar" onclick="agregarAlCarrito()" style="width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
    Agregar al Carrito
</button>
