<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Tienda - Tendencia Lucas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 70px; }
        
        /* Encabezado */
        header { background-color: #ffffff; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
        header h1 { font-size: 20px; color: #4f46e5; font-weight: 800; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        /* Contenedores de Secciones */
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { font-size: 16px; margin-bottom: 15px; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }

        /* Formularios y Selects */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; background-color: #fff; }
        input:focus, select:focus { border-color: #4f46e5; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Botones */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; width: auto; }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; }

        /* Totales */
        .total-box { text-align: right; margin-top: 15px; font-size: 18px; font-weight: 800; color: #0f172a; }

        /* Navegación Inferior (Barra de Menú) */
        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; height: 60px; z-index: 100; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #64748b; cursor: pointer; text-decoration: none; border-top: 3px solid transparent; }
        .nav-item.active { color: #4f46e5; border-top-color: #4f46e5; background-color: #f8fafc; }

        /* Ocultar secciones inactivas */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <header>
        <h1>POS Tienda</h1>
    </header>

    <div class="container">

        <!-- ================= PESTAÑA: VENDER ================= -->
        <div id="tabVender" class="tab-content active">
            
            <!-- 1. Seleccionar Producto -->
            <div class="card">
                <h3>1. Seleccionar Producto</h3>
                
                <div class="grid-2 form-group">
                    <div>
                        <label>Marca / Producto</label>
                        <select id="selectMarca" onchange="actualizarOpcionesColores()">
                            <option value="">Selecciona una marca...</option>
                        </select>
                    </div>
                    <div>
                        <label>Color</label>
                        <select id="selectColor" onchange="actualizarOpcionesTallas()" disabled>
                            <option value="">Primero elige Marca</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2 form-group">
                    <div>
                        <label>Talla</label>
                        <select id="selectTalla" disabled>
                            <option value="">Primero elige Color</option>
                        </select>
                    </div>
                    <div>
                        <label>Cantidad a Vender</label>
                        <input type="number" id="cantVender" value="1" min="1">
                    </div>
                </div>

                <button class="btn btn-primary" onclick="agregarAlCarrito()">Agregar al Carrito</button>
            </div>

            <!-- 2. Detalle de Venta -->
            <div class="card">
                <h3>2. Detalle de Venta</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Prod</th>
                            <th>Cant</th>
                            <th>Precio C/U</th>
                            <th>Subt</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCarrito">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Carrito vacío</td></tr>
                    </tbody>
                </table>

                <div class="total-box">
                    Total: Bs. <span id="totalCarrito">0.00</span>
                </div>

                <button class="btn btn-success" style="margin-top: 15px;" onclick="registrarVenta()">Registrar Venta</button>
            </div>

        </div>


        <!-- ================= PESTAÑA: INVENTARIO ================= -->
        <div id="tabInventario" class="tab-content">
            
            <div class="card">
                <h3>Agregar Producto al Inventario</h3>
                <div class="grid-2 form-group">
                    <div>
                        <label>Marca / Producto</label>
                        <input type="text" id="invMarca" placeholder="Ej. POLO">
                    </div>
                    <div>
                        <label>Color</label>
                        <input type="text" id="invColor" placeholder="Ej. BLANCO">
                    </div>
                </div>
                <div class="grid-2 form-group">
                    <div>
                        <label>Talla</label>
                        <input type="text" id="invTalla" placeholder="Ej. M">
                    </div>
                    <div>
                        <label>Precio (Bs.)</label>
                        <input type="number" id="invPrecio" placeholder="100">
                    </div>
                </div>
                <div class="form-group">
                    <label>Cantidad (Stock Initial)</label>
                    <input type="number" id="invStock" placeholder="10">
                </div>
                <button class="btn btn-primary" onclick="guardarNuevoProducto()">Guardar en Inventario</button>
            </div>

            <div class="card">
                <h3>Stock Actual</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Color / Talla</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- Menú de Navegación Inferior -->
    <nav class="nav-bottom">
        <div class="nav-item active" onclick="cambiarPestaña('tabVender', this)">Vender</div>
        <div class="nav-item" onclick="cambiarPestaña('tabInventario', this)">Inventario</div>
    </nav>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Datos Iniciales de Ejemplo
        let inventario = JSON.parse(localStorage.getItem('pos_inventario')) || [
            { id: 1, marca: "POLO", color: "BLANCO", talla: "M", precio: 120, stock: 10 },
            { id: 2, marca: "POLO", color: "NEGRO", talla: "L", precio: 120, stock: 5 },
            { id: 3, marca: "COLUMBIA", color: "VERDE", talla: "S", precio: 180, stock: 8 }
        ];

        let carrito = [];

        // Inicializar aplicación
        document.addEventListener("DOMContentLoaded", () => {
            actualizarTablaInventario();
            cargarMarcas();
        });

        // NAVEGACIÓN ENTRE PESTAÑAS
        function cambiarPestaña(tabId, elemento) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            elemento.classList.add('active');

            if(tabId === 'tabVender') {
                cargarMarcas();
            }
        }

        // ================= SISTEMA DE FILTRADO (MARCA -> COLOR -> TALLA) =================

        function cargarMarcas() {
            const selectMarca = document.getElementById('selectMarca');
            selectMarca.innerHTML = '<option value="">Selecciona una marca...</option>';
            
            const marcas = [...new Set(inventario.map(item => item.marca))];
            
            marcas.forEach(marca => {
                if(marca) {
                    const option = document.createElement('option');
                    option.value = marca;
                    option.textContent = marca;
                    selectMarca.appendChild(option);
                }
            });

            // Reiniciar selectores dependientes
            actualizarOpcionesColores();
        }

        function actualizarOpcionesColores() {
            const marcaSeleccionada = document.getElementById('selectMarca').value;
            const selectColor = document.getElementById('selectColor');
            const selectTalla = document.getElementById('selectTalla');
            
            selectColor.innerHTML = '<option value="">Selecciona Color...</option>';
            selectTalla.innerHTML = '<option value="">Primero elige Color</option>';
            selectTalla.disabled = true;

            if (!marcaSeleccionada) {
                selectColor.disabled = true;
                return;
            }

            const filtrados = inventario.filter(p => p.marca === marcaSeleccionada && p.stock > 0);
            const colores = [...new Set(filtrados.map(p => p.color))];

            colores.forEach(color => {
                const option = document.createElement('option');
                option.value = color;
                option.textContent = color;
                selectColor.appendChild(option);
            });

            selectColor.disabled = false;
        }

        function actualizarOpcionesTallas() {
            const marcaSeleccionada = document.getElementById('selectMarca').value;
            const colorSeleccionado = document.getElementById('selectColor').value;
            const selectTalla = document.getElementById('selectTalla');

            selectTalla.innerHTML = '<option value="">Selecciona Talla...</option>';

            if (!colorSeleccionado) {
                selectTalla.disabled = true;
                return;
            }

            const filtrados = inventario.filter(p => 
                p.marca === marcaSeleccionada && 
                p.color === colorSeleccionado && 
                p.stock > 0
            );
            
            const tallas = [...new Set(filtrados.map(p => p.talla))];

            tallas.forEach(talla => {
                const option = document.createElement('option');
                option.value = talla;
                option.textContent = talla;
                selectTalla.appendChild(option);
            });

            selectTalla.disabled = false;
        }

        // ================= GESTIÓN DEL CARRITO =================

        function agregarAlCarrito() {
            const marca = document.getElementById('selectMarca').value;
            const color = document.getElementById('selectColor').value;
            const talla = document.getElementById('selectTalla').value;
            const cantidad = parseInt(document.getElementById('cantVender').value);

            if (!marca || !color || !talla) {
                alert("Por favor selecciona Marca, Color y Talla.");
                return;
            }

            const productoEncontrado = inventario.find(p => 
                p.marca === marca && p.color === color && p.talla === talla
            );

            if (!productoEncontrado) {
                alert("Producto no disponible en stock.");
                return;
            }

            if (productoEncontrado.stock < cantidad) {
                alert(`Stock insuficiente. Solo quedan ${productoEncontrado.stock} unidades.`);
                return;
            }

            // Agregar al carrito
            carrito.push({
                id: productoEncontrado.id,
                producto: `${marca} (${color} - ${talla})`,
                precio: productoEncontrado.precio,
                cantidad: cantidad,
                subtotal: productoEncontrado.precio * cantidad
            });

            actualizarTablaCarrito();
        }

        function actualizarTablaCarrito() {
            const tbody = document.getElementById('tablaCarrito');
            tbody.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Carrito vacío</td></tr>';
                document.getElementById('totalCarrito').textContent = '0.00';
                return;
            }

            carrito.forEach((item, index) => {
                total += item.subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.producto}</td>
                        <td>${item.cantidad}</td>
                        <td>Bs. ${item.precio}</td>
                        <td>Bs. ${item.subtotal}</td>
                        <td><button class="btn-danger" onclick="eliminarDelCarrito(${index})">X</button></td>
                    </tr>
                `;
            });

            document.getElementById('totalCarrito').textContent = total.toFixed(2);
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarTablaCarrito();
        }

        function registrarVenta() {
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            // Descontar del inventario
            carrito.forEach(item => {
                const prodIndex = inventario.findIndex(p => p.id === item.id);
                if (prodIndex !== -1) {
                    inventario[prodIndex].stock -= item.cantidad;
                }
            });

            // Guardar cambios
            localStorage.setItem('pos_inventario', JSON.stringify(inventario));
            carrito = [];
            
            actualizarTablaCarrito();
            actualizarTablaInventario();
            cargarMarcas();
            
            alert("¡Venta registrada con éxito!");
        }

        // ================= GESTIÓN DEL INVENTARIO =================

        function guardarNuevoProducto() {
            const marca = document.getElementById('invMarca').value.toUpperCase().trim();
            const color = document.getElementById('invColor').value.toUpperCase().trim();
            const talla = document.getElementById('invTalla').value.toUpperCase().trim();
            const precio = parseFloat(document.getElementById('invPrecio').value);
            const stock = parseInt(document.getElementById('invStock').value);

            if (!marca || !color || !talla || isNaN(precio) || isNaN(stock)) {
                alert("Completa todos los campos adecuadamente.");
                return;
            }

            const nuevoItem = {
                id: Date.now(),
                marca, color, talla, precio, stock
            };

            inventario.push(nuevoItem);
            localStorage.setItem('pos_inventario', JSON.stringify(inventario));

            actualizarTablaInventario();
            
            // Limpiar inputs
            document.getElementById('invMarca').value = '';
            document.getElementById('invColor').value = '';
            document.getElementById('invTalla').value = '';
            document.getElementById('invPrecio').value = '';
            document.getElementById('invStock').value = '';

            alert("Producto guardado en inventario.");
        }

        function actualizarTablaInventario() {
            const tbody = document.getElementById('tablaInventario');
            tbody.innerHTML = '';

            inventario.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.marca}</strong></td>
                        <td>${item.color} / ${item.talla}</td>
                        <td>Bs. ${item.precio}</td>
                        <td><span style="color: ${item.stock > 0 ? '#10b981' : '#ef4444'}; font-weight:bold;">${item.stock}</span></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
